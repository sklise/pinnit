<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinnit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <img class="logo-icon" src="../icons/icon-48.png" alt="Pinnit Logo">
        <h1 class="app-title">Pinnit</h1>
      </div>
    </header>

    <main class="app-content">
      <section class="overview-section">
        <h2 class="section-title">Pinned Tabs</h2>
        <p class="section-desc">Navigating to a new domain in a pinned tab will create a new tab.</p>
      </section>

      <section class="list-section">
        <!-- Dynamic list of locked pinned tabs -->
        <ul id="locked-tabs-list" class="tab-list">
          <li class="loading-state">Loading tabs...</li>
        </ul>
      </section>
    </main>

    <footer class="app-footer">
      <p class="footer-note"><strong>Strict</strong> mode prevents subdomain changes</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
